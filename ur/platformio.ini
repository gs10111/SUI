; DE-PURI-DI261924 REV A - firmware de aplicacao da Unidade Remota (UR-DI151399).
; Supervisor de Inclinacao SUI-DI141388XY. Requisitos em ../DECISIONS.md e ../docs/.
;
; Dois envs por desenho: esp32dev compila tudo, native compila SO o dominio e a camada de
; aplicacao. Se um arquivo de src/domain/ ou src/app/ passar a depender de hardware, o env
; native para de compilar - e essa quebra e o teste de arquitetura mais barato que existe.
; O check_hexagonal.py roda antes dos dois e reprova o build por include proibido.

[platformio]
default_envs = esp32dev
lib_dir = ../lib_shared

[common]
fw_version = 0.1.0
board_rev = A
; Flags estritos so no codigo do projeto: o framework Arduino e o Unity sao C e quebram
; com -fno-rtti e -Werror.
strict_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -Wshadow
    -Werror
strict_flags_c_safe =
    -Wall
    -Wextra
    -Wshadow
    -Werror
defines =
    -DFW_VERSION=\"${common.fw_version}\"
    -DBOARD_REV=\"${common.board_rev}\"

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../lib_shared
build_flags =
    ${common.defines}
    -I include
    -I src
build_src_flags = ${common.strict_flags}
build_src_filter = +<*>
extra_scripts = pre:scripts/check_hexagonal.py

[env:native]
platform = native
lib_extra_dirs = ../lib_shared
build_flags =
    ${common.defines}
    -DHOST_BUILD=1
    -I include
    -I src
    -I test
build_src_flags = ${common.strict_flags_c_safe}
; Nada de src/adapters/ aqui: dominio e aplicacao tem de compilar sem Arduino.
build_src_filter =
    +<domain/>
    +<app/>
test_framework = unity
test_build_src = yes
extra_scripts = pre:scripts/check_hexagonal.py
