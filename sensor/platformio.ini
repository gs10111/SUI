; PUSI-DI261930 - firmware da placa sensora de inclinacao (ESP32-WROOM-32D + SCL3300).
; Compartilha o formato de quadro e os codigos de erro com a supervisora via ../lib_shared.

[platformio]
default_envs = pusi

[common]
fw_version = 0.2.0
board_rev = A
strict_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -Wshadow
    -Werror
strict_flags_c_safe =
    -Wall
    -Wextra
    -Wshadow
    -Werror
defines =
    -DFW_VERSION=\"${common.fw_version}\"
    -DBOARD_REV=\"${common.board_rev}\"

[env:pusi]
platform = espressif32
board = esp32dev
; Tabela FIXADA, nao herdada do framework: ver o cabecalho do proprio
; arquivo. Um bump de framework que mexa no default.csv moveria o offset da app1
; e a frota gravada em campo pararia de subir.
board_build.partitions = ../particoes_sui_4mb.csv
extra_scripts = pre:scripts/check_particoes.py, post:scripts/check_rollback_hook.py
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_extra_dirs = ../lib_shared
build_flags =
    ${common.defines}
    -I include
    -I src
build_src_flags = ${common.strict_flags}
build_src_filter = +<*>

[env:native]
platform = native
lib_extra_dirs = ../lib_shared
build_flags =
    ${common.defines}
    -DHOST_BUILD=1
    -I include
    -I src
build_src_flags = ${common.strict_flags_c_safe}
build_src_filter =
    +<drivers/scl3300_math.cpp>
    +<proto/modbus_slave.cpp>
    +<proto/jig_slave.cpp>
test_framework = unity
test_build_src = yes
