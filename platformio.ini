; DE-PURI-DI261924 REV A - firmware de teste de fabrica
; Os flags estritos ficam em build_src_flags: valem para o codigo do projeto, nao para o
; framework Arduino nem para o Unity (que sao C e quebrariam com -fno-rtti/-Werror).

[platformio]
default_envs = esp32dev
lib_dir = lib_shared

[common]
fw_version = 0.1.0
board_rev = A
strict_flags =
    -std=gnu++17
    -fno-exceptions
    -fno-rtti
    -Wall
    -Wextra
    -Wshadow
    -Werror
; subconjunto seguro para C: o PlatformIO compila unity_config.c com os flags de src no env native
strict_flags_c_safe =
    -Wall
    -Wextra
    -Wshadow
    -Werror
defines =
    -DFW_VERSION=\"${common.fw_version}\"
    -DBOARD_REV=\"${common.board_rev}\"
    -DDISPLAY_DRIVER=DISPLAY_DRIVER_NULL
    -DIHM_ENABLED=0
defines_ihm_host =
    -DFW_VERSION=\"${common.fw_version}\"
    -DBOARD_REV=\"${common.board_rev}\"
    -DDISPLAY_DRIVER=DISPLAY_DRIVER_NULL
    -DIHM_ENABLED=1
defines_ihm =
    -DFW_VERSION=\"${common.fw_version}\"
    -DBOARD_REV=\"${common.board_rev}\"
    -DDISPLAY_DRIVER=DISPLAY_DRIVER_U8G2
    -DIHM_ENABLED=1

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
    ${common.defines}
    -I include
    -I src
build_src_flags = ${common.strict_flags}
build_src_filter = +<*> -<sim/>
lib_deps =

[env:native]
platform = native
build_flags =
    ${common.defines}
    -DHOST_BUILD=1
    -I include
    -I src
build_src_flags = ${common.strict_flags_c_safe}
build_src_filter =
    +<core/cmd_parser.cpp>
    +<core/report.cpp>
    +<core/verdict.cpp>
    +<drivers/calibration.cpp>
test_framework = unity
test_build_src = yes

[env:esp32dev-ihm]
extends = env:esp32dev
lib_deps = olikraus/U8g2@^2.35.30
build_flags =
    ${common.defines_ihm}
    -I include
    -I src

[sim_common]
platform = native
build_src_flags = ${common.strict_flags}
build_src_filter =
    +<core/cmd_parser.cpp>
    +<core/console.cpp>
    +<core/registry.cpp>
    +<core/report.cpp>
    +<core/test_runner.cpp>
    +<core/verdict.cpp>
    +<drivers/calibration.cpp>
    +<proto/echo_protocol.cpp>
    +<sim/sim_commands.cpp>
    +<sim/sim_main.cpp>
    +<tests/*.cpp>

[env:sim]
extends = sim_common
build_flags =
    ${common.defines}
    -DHOST_BUILD=1
    -I include
    -I src

[env:sim-ihm]
extends = sim_common
build_flags =
    ${common.defines_ihm_host}
    -DHOST_BUILD=1
    -I include
    -I src
